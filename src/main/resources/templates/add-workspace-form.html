<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
</head>
<body>
<h1>Add a workspace</h1>
<form th:action="@{/admin/add-workspace}" method="post">
    <label for="type">Select type:</label>
    <select name="type" id="type">
        <option th:each="type : ${availableRoomTypes}"
                th:value="${type}"
                th:text="${type}">Type
        </option>
    </select>
    <br>

    <label for="price">Price</label>
    <input type="number" name="price" id="price">
    <br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
